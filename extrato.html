<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>PoppeFin | Extrato Detalhado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.05);
        }

        .card-entrada { border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.04); }
        .card-saida   { border-left: 4px solid #f43f5e; background: rgba(244, 63, 94, 0.04); }
        .card-rendimento { border-left: 4px solid #6366f1; background: rgba(99, 102, 241, 0.04); }

        #export-area-tecnica {
            position: absolute;
            left: -9999px;
            width: 1080px;
            padding: 60px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .logo-pdf { font-size: 85px; font-weight: 800; color: #1e293b; text-align: center; margin-bottom: 10px; }
        .logo-pdf span { color: #4f46e5; }

        /* Loading bar */
        .loading-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #6366f1);
            background-size: 200% 100%;
            z-index: 999;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s;
        }
        .loading-bar.ativo { transform: scaleX(1); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 41, 59, 0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.3s;
            z-index: 200;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Modal sheet */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        /* Animações */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mov-card { animation: slideUp 0.3s ease-out both; }

        /* Chips de filtro */
        .tipo-chip {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            border: 1.5px solid #e2e8f0;
            color: #64748b;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tipo-chip.ativo-todos    { background: #1e293b; color: white; border-color: #1e293b; }
        .tipo-chip.ativo-entrada  { background: #10b981; color: white; border-color: #10b981; }
        .tipo-chip.ativo-saida    { background: #f43f5e; color: white; border-color: #f43f5e; }
        .tipo-chip.ativo-transf   { background: #8b5cf6; color: white; border-color: #8b5cf6; }
        .tipo-chip.ativo-rend     { background: #6366f1; color: white; border-color: #6366f1; }

        .card-transferencia { border-left: 4px solid #8b5cf6; background: rgba(139, 92, 246, 0.04); }

        .filtros-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filtros-scroll::-webkit-scrollbar { display: none; }

        /* Bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 -8px 32px rgba(0,0,0,0.08);
            z-index: 50;
            padding: 8px 0 env(safe-area-inset-bottom);
        }

        /* Skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-wave 1.5s infinite;
            border-radius: 16px;
        }
        @keyframes skeleton-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Grupo por data */
        .data-group-label {
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 8px 4px 4px;
        }

        /* Sessão ticker */
        .session-dot {
            width: 6px; height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .session-dot.warning { background: #f59e0b; }
        .session-dot.danger  { background: #f43f5e; }
    </style>
</head>
<body class="text-slate-800">

    <div id="loadingBar" class="loading-bar"></div>
    <div id="toastMsg" class="toast"></div>
    <div id="export-area-tecnica"></div>

    <!-- Modal Sessão Expirando -->
    <div id="modalSessao" class="modal-overlay">
        <div class="glass-card p-8 rounded-[32px] w-full max-w-sm shadow-2xl mx-4">
            <div class="text-center">
                <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-clock text-amber-500 text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-2">Sessão Expirando</h3>
                <p class="text-slate-500 text-sm mb-6">Inativo por 9 min. Deseja continuar?</p>
                <div class="flex gap-3">
                    <button onclick="sairSistema()" class="flex-1 py-3 font-bold text-slate-500 bg-slate-100 rounded-xl active:scale-95">Sair</button>
                    <button onclick="renovarSessao()" class="flex-1 py-3 font-bold bg-indigo-600 text-white rounded-xl shadow-lg active:scale-95">Continuar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto p-4 md:p-8 space-y-4">

        <!-- Header -->
        <div>
            <div class="flex items-center justify-between">
                <div>
                    <button onclick="window.location.href='dashboard.html'"
                        class="text-indigo-600 font-bold text-sm mb-2 flex items-center gap-2 active:scale-95 transition-all">
                        <i class="fas fa-arrow-left text-xs"></i> Dashboard
                    </button>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Poppe<span class="text-indigo-600">Fin</span> Extrato</h1>
                    <p class="text-slate-500 text-xs font-medium">Histórico de movimentações</p>
                </div>
                <div class="flex items-center gap-2">
                    <div class="hidden md:flex items-center gap-2 mr-1">
                        <div class="session-dot" id="sessionDot"></div>
                        <span id="sessionTime" class="text-[11px] font-bold text-slate-400">10:00</span>
                    </div>
                    <button onclick="trocarApiUrl()" title="Configurar conexão"
                        class="w-10 h-10 bg-white/60 rounded-xl flex items-center justify-center shadow-sm active:scale-95">
                        <i class="fas fa-plug text-slate-400 text-sm"></i>
                    </button>
                    <button onclick="carregarDados()"
                        class="w-10 h-10 bg-white/60 rounded-xl flex items-center justify-center shadow-sm active:scale-95">
                        <i class="fas fa-sync-alt text-indigo-500 text-sm" id="iconSync"></i>
                    </button>
                    <button onclick="exportarCSV()" title="Exportar CSV"
                        class="h-10 px-3 bg-white/60 text-slate-600 rounded-xl font-bold text-sm flex items-center gap-2 shadow-sm active:scale-95">
                        <i class="fas fa-file-csv"></i>
                    </button>
                    <button id="btnExport" onclick="exportarPDF()"
                        class="h-10 px-4 bg-indigo-600 text-white rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg shadow-indigo-200 active:scale-95">
                        <i class="fas fa-file-pdf"></i>
                        <span class="hidden md:inline">Exportar PDF</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="glass-card p-4 rounded-[24px] space-y-3">
            <!-- Busca -->
            <div class="relative">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                <input type="text" id="campoBusca" oninput="filtrarExtrato()" placeholder="Pesquisar por descrição, banco, titular ou detalhamento..."
                    class="w-full bg-white border-none pl-9 pr-8 py-2.5 rounded-xl outline-none shadow-sm text-sm font-medium text-slate-700">
                <button onclick="document.getElementById('campoBusca').value='';filtrarExtrato()" id="btnLimparBusca"
                    class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 text-xs">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>
            <!-- Linha 1: Conta + Período -->
            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col">
                    <label class="text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">Conta</label>
                    <select id="filtroConta" onchange="filtrarExtrato()"
                        class="bg-white border-none p-2.5 rounded-xl outline-none shadow-sm text-sm font-semibold text-slate-700 cursor-pointer"></select>
                </div>
                <div class="flex flex-col">
                    <label class="text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">Período</label>
                    <select id="filtroPeriodo" onchange="filtrarExtrato()"
                        class="bg-white border-none p-2.5 rounded-xl outline-none shadow-sm text-sm font-semibold text-slate-700 cursor-pointer">
                        <option value="0">Tudo</option>
                        <option value="1">1 Mês</option>
                        <option value="3">3 Meses</option>
                        <option value="12">1 Ano</option>
                    </select>
                </div>
            </div>
            <!-- Linha 2: Banco + Titular -->
            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col">
                    <label class="text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">Banco</label>
                    <select id="filtroBanco" onchange="filtrarExtrato()"
                        class="bg-white border-none p-2.5 rounded-xl outline-none shadow-sm text-sm font-semibold text-slate-700 cursor-pointer"></select>
                </div>
                <div class="flex flex-col">
                    <label class="text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">Titular</label>
                    <select id="filtroTitular" onchange="filtrarExtrato()"
                        class="bg-white border-none p-2.5 rounded-xl outline-none shadow-sm text-sm font-semibold text-slate-700 cursor-pointer"></select>
                </div>
            </div>
            <!-- Linha 3: Chips de tipo (scroll horizontal) -->
            <div class="filtros-scroll">
                <button class="tipo-chip ativo-todos" onclick="setTipo('TODOS', this)">
                    <i class="fas fa-th-list mr-1"></i> Todos
                </button>
                <button class="tipo-chip" onclick="setTipo('Entrada', this)">
                    <i class="fas fa-arrow-down mr-1"></i> Entradas
                </button>
                <button class="tipo-chip" onclick="setTipo('Saída', this)">
                    <i class="fas fa-arrow-up mr-1"></i> Saídas
                </button>
                <button class="tipo-chip" onclick="setTipo('Transferência', this)">
                    <i class="fas fa-exchange-alt mr-1"></i> Transferências
                </button>
                <button class="tipo-chip" onclick="setTipo('Rendimento', this)">
                    <i class="fas fa-chart-line mr-1"></i> Rendimentos
                </button>
            </div>
            <div class="flex justify-end">
                <button onclick="limparFiltrosExtrato()" class="text-[10px] font-bold text-slate-400 hover:text-indigo-600 uppercase tracking-wide">
                    <i class="fas fa-eraser mr-1"></i> Limpar filtros
                </button>
            </div>
        </div>

        <!-- Painel de somas -->
        <div id="painelSomas" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

        <!-- Contador de resultados -->
        <div class="flex items-center justify-between px-1">
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wide" id="contadorResultados">— registros</p>
            <p class="text-[11px] font-bold text-slate-400" id="lastUpdated"></p>
        </div>

        <!-- Lista de movimentações agrupadas por data -->
        <div id="containerExtrato" class="space-y-1 pb-4"></div>

    </div>

    <!-- Bottom Nav Mobile -->
    <nav class="bottom-nav md:hidden">
        <div class="relative flex items-center justify-around px-2 h-16">
            <button onclick="window.location.href='dashboard.html'" class="flex flex-col items-center gap-1 text-slate-400 flex-1 py-2">
                <i class="fas fa-chart-pie text-lg"></i>
                <span class="text-[9px] font-bold uppercase tracking-wide">Dashboard</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-indigo-600 flex-1 py-2">
                <i class="fas fa-list-ul text-lg"></i>
                <span class="text-[9px] font-bold uppercase tracking-wide">Extrato</span>
            </button>
            <div class="flex-1 flex items-center justify-center">
                <button onclick="window.location.href='lancamento.html'"
                    class="absolute w-14 h-14 bg-indigo-600 rounded-full flex items-center justify-center shadow-lg shadow-indigo-300 hover:bg-indigo-700 active:scale-95 transition-all"
                    style="bottom: 20px;">
                    <i class="fas fa-plus text-white text-xl"></i>
                </button>
            </div>
            <button onclick="exportarPDF()" class="flex flex-col items-center gap-1 text-slate-400 flex-1 py-2">
                <i class="fas fa-file-pdf text-lg"></i>
                <span class="text-[9px] font-bold uppercase tracking-wide">PDF</span>
            </button>
            <button onclick="window.location.href='contas.html'" class="flex flex-col items-center gap-1 text-slate-400 flex-1 py-2">
                <i class="fas fa-university text-lg"></i>
                <span class="text-[9px] font-bold uppercase tracking-wide">Contas</span>
            </button>
        </div>
    </nav>

    <script>
        // ============================================================
        // CONEXÃO COM A API (Google Apps Script)
        // ============================================================
        // URL padrão do Web App do Apps Script — já embutida no código, então
        // nenhum dispositivo novo precisa colar a URL manualmente. Se um dia você
        // reimplantar o Apps Script e a URL mudar, use o botão de configuração
        // (ícone da tomada) para trocar; a nova URL fica salva só naquele navegador.
        const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwaIsf1cABPNnlYHZRwzf2oAItMbyKk33Uz_JPj9fysQHVF9dBaCRqnJvCsjOA8_crG_g/exec';
        function getApiUrl() {
            let u = localStorage.getItem('poppefinApiUrl');
            if (!u) {
                u = DEFAULT_API_URL;
                localStorage.setItem('poppefinApiUrl', u);
            }
            return u || '';
        }
        function trocarApiUrl() {
            const atual = localStorage.getItem('poppefinApiUrl') || '';
            const nova = prompt('URL do Apps Script:', atual);
            if (nova && nova.trim()) { localStorage.setItem('poppefinApiUrl', nova.trim()); location.reload(); }
        }
        const SCRIPT_URL = getApiUrl();
        console.log('[PoppeFin] SCRIPT_URL em uso:', SCRIPT_URL);

        async function apiGet(action) {
            let res;
            try {
                res = await fetch(`${SCRIPT_URL}?action=${action}&t=${Date.now()}`);
            } catch (err) {
                throw new Error('Falha de rede/CORS ao contatar a API. Confira a URL configurada (ícone da tomada).');
            }
            const text = await res.text();
            let json;
            try {
                json = JSON.parse(text);
            } catch (err) {
                console.error('[PoppeFin] Resposta não-JSON recebida:', text.slice(0, 500));
                if (/accounts\.google\.com|ServiceLogin|Sign in/i.test(text)) {
                    throw new Error('O Apps Script pediu login do Google. Reimplante com acesso "Qualquer pessoa" (não "Qualquer pessoa com Google").');
                }
                throw new Error('A API não retornou JSON válido. Confira se a URL termina em /exec e se foi implantada como App da Web.');
            }
            if (!json.success) throw new Error(json.message || 'Erro ao buscar dados');
            return json;
        }

        // Converte as movimentações da API para o formato usado pela tela,
        // preservando TRANSFERÊNCIA como um único registro (com conta/banco/titular
        // de origem e destino) em vez de dividi-la — aqui o usuário precisa ver
        // (e mais tarde editar/excluir) o lançamento real, não uma versão sintética.
        function adaptarParaExtrato(movimentacoes) {
            return (movimentacoes || []).map(m => ({
                'ID': m.id,
                'Data': m.data || '',
                'ID Conta': m.idConta,
                'ID Conta Destino': m.idContaDestino,
                'Banco': m.banco,
                'Banco Destino': m.bancoDestino,
                'Descrição': m.descricao,
                'Tipo': normalizarTipoApi(m.tipo) === 'ENTRADA' ? 'Entrada' : normalizarTipoApi(m.tipo) === 'SAÍDA' ? 'Saída' : 'Transferência',
                'Valor Aporte': parseFloat(m.valor) || 0,
                'Valor Rendimento': parseFloat(m.valorRendimento) || 0,
                'Detalhamento': m.detalhamento || '',
                'Titular Conta': m.titularConta,
                'Titular Destino': m.titularDestino
            }));
        }

                // Normaliza o campo "tipo" vindo da planilha — lida com dados antigos
        // gravados como "Entrada"/"Saída" (só a 1ª maiúscula) em vez do formato
        // ENTRADA/SAÍDA/TRANSFERÊNCIA que o backend novo grava.
        function normalizarTipoApi(raw) {
            const t = (raw || '').toString().trim().toUpperCase();
            if (t === 'ENTRADA') return 'ENTRADA';
            if (t === 'SAÍDA' || t === 'SAIDA') return 'SAÍDA';
            if (t.indexOf('TRANSFER') === 0) return 'TRANSFERÊNCIA';
            return 'SAÍDA';
        }
        let dadosRaw = [];
        let filtroTipoAtivo = 'TODOS';

        // =============================================
        // SESSÃO - 10 minutos
        // =============================================
        const TIMEOUT_MS = 10 * 60 * 1000;
        const WARNING_MS = 9 * 60 * 1000;
        let sessionTimer, warningTimer, countdownInterval;
        let sessionRemaining = TIMEOUT_MS;

        function iniciarSessao() {
            clearTimeout(sessionTimer);
            clearTimeout(warningTimer);
            clearInterval(countdownInterval);
            sessionRemaining = TIMEOUT_MS;
            atualizarTicker();

            countdownInterval = setInterval(() => {
                sessionRemaining -= 1000;
                if (sessionRemaining <= 0) { clearInterval(countdownInterval); sairSistema(); }
                else atualizarTicker();
            }, 1000);

            warningTimer = setTimeout(() => {
                document.getElementById('modalSessao').style.display = 'flex';
            }, WARNING_MS);

            sessionTimer = setTimeout(sairSistema, TIMEOUT_MS);
        }

        function atualizarTicker() {
            const mins = Math.floor(sessionRemaining / 60000);
            const secs = Math.floor((sessionRemaining % 60000) / 1000);
            const el = document.getElementById('sessionTime');
            const dot = document.getElementById('sessionDot');
            if (el) el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            if (dot) {
                dot.className = 'session-dot';
                if (sessionRemaining < 60000) dot.classList.add('danger');
                else if (sessionRemaining < 180000) dot.classList.add('warning');
            }
        }

        function renovarSessao() {
            document.getElementById('modalSessao').style.display = 'none';
            iniciarSessao();
            mostrarToast('Sessão renovada ✓');
        }

        function sairSistema() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        ['touchstart', 'click', 'keydown', 'scroll'].forEach(ev => {
            document.addEventListener(ev, iniciarSessao, { passive: true });
        });

        // =============================================
        // PERSISTÊNCIA
        // =============================================
        function salvarEstado() {
            sessionStorage.setItem('extratoEstado', JSON.stringify({
                filtroConta: document.getElementById('filtroConta').value,
                filtroPeriodo: document.getElementById('filtroPeriodo').value,
                filtroTipo: filtroTipoAtivo,
                filtroBanco: document.getElementById('filtroBanco')?.value || 'TODOS',
                filtroTitular: document.getElementById('filtroTitular')?.value || 'TODOS',
                busca: document.getElementById('campoBusca')?.value || ''
            }));
        }

        function restaurarEstado() {
            const saved = sessionStorage.getItem('extratoEstado');
            if (!saved) return;
            const e = JSON.parse(saved);
            if (e.filtroTipo && e.filtroTipo !== 'TODOS') {
                filtroTipoAtivo = e.filtroTipo;
                // Ativar chip correto
                document.querySelectorAll('.tipo-chip').forEach(chip => {
                    chip.className = 'tipo-chip';
                    if (chip.getAttribute('data-tipo') === e.filtroTipo) {
                        const cls = { 'Entrada': 'ativo-entrada', 'Saída': 'ativo-saida', 'Transferência': 'ativo-transf', 'Rendimento': 'ativo-rend' };
                        chip.classList.add(cls[e.filtroTipo] || 'ativo-todos');
                    }
                });
            }
            return e;
        }

        // =============================================
        // TOAST
        // =============================================
        function mostrarToast(msg) {
            const t = document.getElementById('toastMsg');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // =============================================
        // DADOS
        // =============================================
        async function carregarDados() {
            const icon = document.getElementById('iconSync');
            const lb = document.getElementById('loadingBar');
            icon.classList.add('animate-spin');
            lb.classList.add('ativo');

            // Skeleton
            document.getElementById('containerExtrato').innerHTML = `
                <div class="skeleton h-16 mb-2"></div>
                <div class="skeleton h-16 mb-2"></div>
                <div class="skeleton h-16 mb-2"></div>
                <div class="skeleton h-16 mb-2"></div>
            `;

            try {
                const resultado = await apiGet('getAll');
                dadosRaw = adaptarParaExtrato(resultado.movimentacoes);
                sessionStorage.setItem('extratoData', JSON.stringify(dadosRaw));
                popularFiltroContas();
                popularFiltroBancoTitular();

                const estado = restaurarEstado();
                if (estado) {
                    const sel = document.getElementById('filtroConta');
                    if ([...sel.options].some(o => o.value === estado.filtroConta)) sel.value = estado.filtroConta;
                    const selP = document.getElementById('filtroPeriodo');
                    if ([...selP.options].some(o => o.value === estado.filtroPeriodo)) selP.value = estado.filtroPeriodo;
                    const selB = document.getElementById('filtroBanco');
                    if (selB && estado.filtroBanco && [...selB.options].some(o => o.value === estado.filtroBanco)) selB.value = estado.filtroBanco;
                    const selT = document.getElementById('filtroTitular');
                    if (selT && estado.filtroTitular && [...selT.options].some(o => o.value === estado.filtroTitular)) selT.value = estado.filtroTitular;
                    if (estado.busca) document.getElementById('campoBusca').value = estado.busca;
                }

                filtrarExtrato();
                const now = new Date().toLocaleTimeString('pt-br', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('lastUpdated').innerHTML = `<i class="fas fa-check-circle text-emerald-400 mr-1"></i>Sync ${now}`;
                mostrarToast('Dados atualizados ✓');
            } catch (e) {
                mostrarToast('Erro ao carregar');
                const cached = sessionStorage.getItem('extratoData');
                if (cached) {
                    dadosRaw = JSON.parse(cached);
                    popularFiltroContas();
                    filtrarExtrato();
                } else {
                    document.getElementById('containerExtrato').innerHTML =
                        '<p class="text-center text-slate-400 py-10 text-sm">Sem conexão. Tente novamente.</p>';
                }
            } finally {
                icon.classList.remove('animate-spin');
                lb.classList.remove('ativo');
            }
        }

        function popularFiltroContas() {
            const select = document.getElementById('filtroConta');
            const contas = {};
            dadosRaw.forEach(d => { contas[d['ID Conta']] = `${d['Banco']} - ${d['Descrição']}`; });
            select.innerHTML = '<option value="TODAS">Todas as Contas</option>';
            Object.entries(contas).forEach(([id, nome]) => {
                select.innerHTML += `<option value="${id}">${nome}</option>`;
            });
        }

        function popularFiltroBancoTitular() {
            const selB = document.getElementById('filtroBanco');
            const selT = document.getElementById('filtroTitular');
            const bancos = [...new Set(dadosRaw.map(d => d['Banco']).filter(Boolean))].sort();
            const titulares = [...new Set(dadosRaw.map(d => d['Titular Conta']).filter(Boolean))].sort();
            selB.innerHTML = '<option value="TODOS">Todos os Bancos</option>' +
                bancos.map(b => `<option value="${b}">${b}</option>`).join('');
            selT.innerHTML = '<option value="TODOS">Todos os Titulares</option>' +
                titulares.map(t => `<option value="${t}">${t}</option>`).join('');

        function limparFiltrosExtrato() {
            document.getElementById('campoBusca').value = '';
            document.getElementById('filtroConta').value = 'TODAS';
            document.getElementById('filtroPeriodo').value = '0';
            document.getElementById('filtroBanco').value = 'TODOS';
            document.getElementById('filtroTitular').value = 'TODOS';
            filtroTipoAtivo = 'TODOS';
            document.querySelectorAll('.tipo-chip').forEach(c => c.className = 'tipo-chip');
            document.querySelector('.tipo-chip[data-tipo="TODOS"]').classList.add('ativo-todos');
            filtrarExtrato();
        }

        function formatarMoeda(v) { return v.toLocaleString('pt-br', { style: 'currency', currency: 'BRL' }); }

        function setTipo(tipo, btn) {
            filtroTipoAtivo = tipo;
            document.querySelectorAll('.tipo-chip').forEach(c => c.className = 'tipo-chip');
            const cls = { 'TODOS': 'ativo-todos', 'Entrada': 'ativo-entrada', 'Saída': 'ativo-saida', 'Transferência': 'ativo-transf', 'Rendimento': 'ativo-rend' };
            btn.classList.add(cls[tipo]);
            filtrarExtrato();
            salvarEstado();
        }

        function filtrarExtrato() {
            const fConta = document.getElementById('filtroConta').value;
            const fPeriodo = parseInt(document.getElementById('filtroPeriodo').value);
            const fBanco = document.getElementById('filtroBanco')?.value || 'TODOS';
            const fTitular = document.getElementById('filtroTitular')?.value || 'TODOS';
            const busca = (document.getElementById('campoBusca')?.value || '').trim().toLowerCase();
            document.getElementById('btnLimparBusca')?.classList.toggle('hidden', !busca);
            const container = document.getElementById('containerExtrato');
            const agora = new Date();

            container.innerHTML = '';
            let sEntrada = 0, sSaida = 0, sRend = 0, sTransf = 0;

            let filtrados = dadosRaw.filter(d => {
                const dataMov = new Date(d['Data']);
                const matchConta = fConta === 'TODAS' || String(d['ID Conta']) === fConta || String(d['ID Conta Destino']) === fConta;
                const matchBanco = fBanco === 'TODOS' || d['Banco'] === fBanco || d['Banco Destino'] === fBanco;
                const matchTitular = fTitular === 'TODOS' || d['Titular Conta'] === fTitular || d['Titular Destino'] === fTitular;
                const matchBusca = !busca ||
                    (d['Descrição'] || '').toLowerCase().includes(busca) ||
                    (d['Banco'] || '').toLowerCase().includes(busca) ||
                    (d['Banco Destino'] || '').toLowerCase().includes(busca) ||
                    (d['Titular Conta'] || '').toLowerCase().includes(busca) ||
                    (d['Titular Destino'] || '').toLowerCase().includes(busca) ||
                    (d['Detalhamento'] || '').toLowerCase().includes(busca) ||
                    String(d['Valor Aporte'] || '').includes(busca);
                let matchPeriodo = true;
                if (fPeriodo > 0) {
                    const limite = new Date();
                    limite.setMonth(agora.getMonth() - fPeriodo);
                    matchPeriodo = dataMov >= limite;
                }
                return matchConta && matchBanco && matchTitular && matchBusca && matchPeriodo;
            });

            filtrados.sort((a, b) => (new Date(b['Data']) - new Date(a['Data'])) || (Number(b['ID']) - Number(a['ID'])));

            // Agrupar por data
            const grupos = {};
            let totalCards = 0;

            filtrados.forEach(mov => {
                const vA = parseFloat(mov['Valor Aporte']) || 0;
                const vR = parseFloat(mov['Valor Rendimento']) || 0;
                const dataChave = new Date(mov['Data']).toLocaleDateString('pt-br');
                if (!grupos[dataChave]) grupos[dataChave] = [];

                if (mov['Tipo'] === 'Transferência') {
                    if (vA > 0 && (filtroTipoAtivo === 'TODOS' || filtroTipoAtivo === 'Transferência')) {
                        sTransf += vA;
                        grupos[dataChave].push({ dataF: dataChave, ...mov, valorExibido: vA, tipoExibido: 'Transferência' });
                        totalCards++;
                    }
                } else {
                    if (vA > 0 && (filtroTipoAtivo === 'TODOS' || filtroTipoAtivo === mov['Tipo'])) {
                        if (mov['Tipo'] === 'Entrada') sEntrada += vA; else sSaida += vA;
                        grupos[dataChave].push({ dataF: dataChave, ...mov, valorExibido: vA, tipoExibido: mov['Tipo'] });
                        totalCards++;
                    }
                    if (vR > 0 && (filtroTipoAtivo === 'TODOS' || filtroTipoAtivo === 'Rendimento')) {
                        sRend += vR;
                        grupos[dataChave].push({ dataF: dataChave, ...mov, valorExibido: vR, tipoExibido: 'Rendimento' });
                        totalCards++;
                    }
                }
            });

            document.getElementById('contadorResultados').textContent = `${totalCards} registro${totalCards !== 1 ? 's' : ''}`;

            if (totalCards === 0) {
                container.innerHTML = `
                    <div class="text-center py-16">
                        <i class="fas fa-search text-slate-200 text-4xl mb-4"></i>
                        <p class="text-slate-400 font-semibold text-sm">Nenhuma movimentação encontrada</p>
                        <p class="text-slate-300 text-xs mt-1">Tente ajustar os filtros</p>
                    </div>`;
                atualizarSomas(0, 0, 0, 0);
                return;
            }

            let delay = 0;
            Object.entries(grupos).forEach(([data, movs]) => {
                if (movs.length === 0) return;

                // Label de data com dia da semana
                const d = movs[0].Data ? new Date(movs[0].Data) : new Date();
                const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                const diaSemana = diasSemana[d.getDay()];
                const hoje = new Date().toLocaleDateString('pt-br');
                const ontem = new Date(Date.now() - 86400000).toLocaleDateString('pt-br');
                let labelData = `${diaSemana} · ${data}`;
                if (data === hoje) labelData = `Hoje · ${data}`;
                else if (data === ontem) labelData = `Ontem · ${data}`;

                container.innerHTML += `<p class="data-group-label">${labelData}</p>`;

                movs.forEach((m, i) => {
                    delay += 40;
                    container.innerHTML += criarCardHTML(m, delay);
                });
            });

            atualizarSomas(sEntrada, sSaida, sRend, sTransf);
            salvarEstado();
        }

        function criarCardHTML(m, delay) {
            const tipo = m.tipoExibido;
            const valor = m.valorExibido;
            const titular = m['Titular Conta'] || '—';
            const isTransf = tipo === 'Transferência';
            const horaF = m['Data'] ? new Date(m['Data']).toLocaleTimeString('pt-br', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';

            const icon = tipo === 'Entrada' ? 'fa-arrow-down text-emerald-500' :
                         tipo === 'Saída'   ? 'fa-arrow-up text-rose-500'     :
                         isTransf           ? 'fa-exchange-alt text-violet-500' : 'fa-chart-line text-indigo-500';
            const classe = tipo === 'Entrada' ? 'card-entrada' :
                           tipo === 'Saída'   ? 'card-saida'   :
                           isTransf           ? 'card-transferencia' : 'card-rendimento';
            const valClass = tipo === 'Saída' ? 'text-rose-600' : isTransf ? 'text-violet-600' : tipo === 'Rendimento' ? 'text-indigo-600' : 'text-emerald-600';
            const sinal = tipo === 'Saída' ? '−' : isTransf ? '⇄' : '+';
            const chipColor = tipo === 'Entrada' ? 'bg-emerald-100 text-emerald-700' :
                              tipo === 'Saída'   ? 'bg-rose-100 text-rose-700'       :
                              isTransf           ? 'bg-violet-100 text-violet-700'   : 'bg-indigo-100 text-indigo-700';

            const linha2 = isTransf
                ? `<h4 class="font-bold text-slate-700 text-sm truncate">${m['Banco']} <span class="font-normal text-slate-400"><i class="fas fa-long-arrow-alt-right text-[9px] mx-1"></i>${m['Banco Destino'] || ''} · ${m['Descrição'] || ''}</span></h4>`
                : `<h4 class="font-bold text-slate-700 text-sm truncate">${m['Banco']} <span class="font-normal text-slate-400">| ${m['Descrição']}</span></h4>`;
            const linhaTitular = isTransf
                ? `<p class="text-[10px] text-slate-400 italic truncate"><i class="fas fa-user text-[9px] mr-1"></i>${titular} → ${m['Titular Destino'] || '—'}</p>`
                : `<p class="text-[10px] text-slate-400 italic truncate"><i class="fas fa-user text-[9px] mr-1"></i>${titular}</p>`;

                        <div class="min-w-0">
                            <div class="flex items-center gap-2 flex-wrap mb-0.5">

        // =============================================
        // EXPORTAR PDF — layout limpo, legível no celular
        // =============================================
        // Reaplica os mesmos filtros da tela para montar os dados de um relatório
        // (usado tanto pelo PDF quanto pelo CSV), incluindo transferências.
        function coletarLinhasRelatorio() {
            const fConta   = document.getElementById('filtroConta').value;
            const fPer     = parseInt(document.getElementById('filtroPeriodo').value);
            const fBanco   = document.getElementById('filtroBanco')?.value || 'TODOS';
            const fTitular = document.getElementById('filtroTitular')?.value || 'TODOS';
            const busca    = (document.getElementById('campoBusca')?.value || '').trim().toLowerCase();
            const agora    = new Date();

            let filtrados = dadosRaw.filter(d => {
                const dt = new Date(d['Data']);
                const matchConta = fConta === 'TODAS' || String(d['ID Conta']) === fConta || String(d['ID Conta Destino']) === fConta;
                const matchBanco = fBanco === 'TODOS' || d['Banco'] === fBanco || d['Banco Destino'] === fBanco;
                const matchTitular = fTitular === 'TODOS' || d['Titular Conta'] === fTitular || d['Titular Destino'] === fTitular;
                const matchBusca = !busca ||
                    (d['Descrição'] || '').toLowerCase().includes(busca) ||
                    (d['Banco'] || '').toLowerCase().includes(busca) ||
                    (d['Titular Conta'] || '').toLowerCase().includes(busca) ||
                    (d['Detalhamento'] || '').toLowerCase().includes(busca);
                let matchPer = true;
                if (fPer > 0) { const lim = new Date(); lim.setMonth(agora.getMonth() - fPer); matchPer = dt >= lim; }
                return matchConta && matchBanco && matchTitular && matchBusca && matchPer;
            });
            filtrados.sort((a, b) => (new Date(b['Data']) - new Date(a['Data'])) || (Number(b['ID']) - Number(a['ID'])));

            let sE = 0, sS = 0, sR = 0, sT = 0;
            const linhas = [];
            filtrados.forEach(mov => {
                const vA = parseFloat(mov['Valor Aporte']) || 0;
                const vR = parseFloat(mov['Valor Rendimento']) || 0;
                const titular = mov['Titular Conta'] || '—';
                const dataF = new Date(mov['Data']).toLocaleDateString('pt-br');
                if (mov['Tipo'] === 'Transferência') {
                    if (vA > 0 && (filtroTipoAtivo === 'TODOS' || filtroTipoAtivo === 'Transferência')) {
                        sT += vA;
                        linhas.push({ data: dataF, banco: `${mov['Banco']} → ${mov['Banco Destino'] || ''}`, desc: mov['Descrição'], titular: `${titular} → ${mov['Titular Destino'] || ''}`, detalhe: mov['Detalhamento'] || '', valor: vA, tipo: 'Transferência' });
                    }
                } else {
                    if (vA > 0 && (filtroTipoAtivo === 'TODOS' || filtroTipoAtivo === mov['Tipo'])) {
                        if (mov['Tipo'] === 'Entrada') sE += vA; else sS += vA;
                        linhas.push({ data: dataF, banco: mov['Banco'], desc: mov['Descrição'], titular, detalhe: mov['Detalhamento'] || '', valor: vA, tipo: mov['Tipo'] });
                    }
                    if (vR > 0 && (filtroTipoAtivo === 'TODOS' || filtroTipoAtivo === 'Rendimento')) {
                        sR += vR;
                        linhas.push({ data: dataF, banco: mov['Banco'], desc: mov['Descrição'], titular, detalhe: mov['Detalhamento'] || '', valor: vR, tipo: 'Rendimento' });
                    }
                }
            });

            const nomeConta = fConta === 'TODAS' ? 'Todas as Contas' :
                (document.getElementById('filtroConta').options[document.getElementById('filtroConta').selectedIndex]?.text || fConta);
            const nomePer = fPer === 0 ? 'Todo o histórico' : fPer === 1 ? 'Último mês' : fPer === 3 ? 'Últimos 3 meses' : 'Último ano';
            const nomeTipo = { 'TODOS': 'Todos os tipos', 'Entrada': 'Entradas', 'Saída': 'Saídas', 'Transferência': 'Transferências', 'Rendimento': 'Rendimentos' }[filtroTipoAtivo];

            return { linhas, sE, sS, sR, sT, nomeConta, nomePer, nomeTipo, fBanco, fTitular };
        }

        function exportarCSV() {
            const { linhas } = coletarLinhasRelatorio();
            if (linhas.length === 0) { mostrarToast('Nenhum registro para exportar'); return; }
            const cabecalho = ['Data', 'Tipo', 'Banco', 'Descrição', 'Titular', 'Detalhamento', 'Valor'];
            const escapar = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
            const linhasCSV = linhas.map(l => [l.data, l.tipo, l.banco, l.desc, l.titular, l.detalhe, l.valor.toFixed(2).replace('.', ',')].map(escapar).join(';'));
            const csv = '\uFEFF' + [cabecalho.map(escapar).join(';'), ...linhasCSV].join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const data = new Date().toLocaleDateString('pt-br').replace(/\//g, '-');
            a.href = url;
            a.download = `PoppeFin_Extrato_${data}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            mostrarToast('CSV exportado ✓');
        }

        async function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const area = document.getElementById('export-area-tecnica');
            const btn = document.getElementById('btnExport');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            mostrarToast('Gerando PDF...');

            const { linhas, sE, sS, sR, sT, nomeConta, nomePer, nomeTipo } = coletarLinhasRelatorio();

            // Cor por tipo
            function corTipo(t) {
                return t === 'Entrada' ? { bg:'#f0fdf4', border:'#10b981', txt:'#065f46', badge:'#10b981', badgeTxt:'#fff' }
                     : t === 'Saída'   ? { bg:'#fff1f2', border:'#f43f5e', txt:'#9f1239', badge:'#f43f5e', badgeTxt:'#fff' }
                     : t === 'Transferência' ? { bg:'#f5f3ff', border:'#8b5cf6', txt:'#5b21b6', badge:'#8b5cf6', badgeTxt:'#fff' }
                     :                  { bg:'#eef2ff', border:'#6366f1', txt:'#3730a3', badge:'#6366f1', badgeTxt:'#fff' };
            }

            // Linhas da tabela
            const rowsHTML = linhas.map((l, i) => {
                const c = corTipo(l.tipo);
                return `<tr style="background:${i % 2 === 0 ? '#ffffff' : '#f8fafc'}">
                    <td style="padding:14px 16px;font-size:13px;color:#64748b;white-space:nowrap;border-bottom:1px solid #f1f5f9">${l.data}</td>
                    <td style="padding:14px 16px;border-bottom:1px solid #f1f5f9">
                        <span style="display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;background:${c.badge};color:${c.badgeTxt}">${l.tipo}</span>
                    </td>
                    <td style="padding:14px 16px;border-bottom:1px solid #f1f5f9">
                        <div style="font-weight:700;font-size:13px;color:#1e293b">${l.banco}</div>
                        <div style="font-size:11px;color:#94a3b8">${l.desc}</div>
                        <div style="font-size:11px;color:#94a3b8;font-style:italic">${l.titular}</div>
                    </td>
                    <td style="padding:14px 16px;text-align:right;font-weight:800;font-size:14px;color:${c.txt};white-space:nowrap;border-bottom:1px solid #f1f5f9">
                        ${l.tipo === 'Saída' ? '−' : l.tipo === 'Transferência' ? '⇄' : '+'} ${formatarMoeda(l.valor)}
                    </td>
                </tr>`;
            }).join('');

                const pdf = new jsPDF('p', 'mm', [pdfWidth, pdfHeight]);
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');

                pdf.save(`PoppeFin_Relatorio_${data}.pdf`);
