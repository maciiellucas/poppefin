<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PoppeFin | Contas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
        }

        #authOverlay {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .loading-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #6366f1);
            background-size: 200% 100%;
            z-index: 999;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s;
        }
        .loading-bar.ativo { transform: scaleX(1); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            color: white;
            padding: 12px 22px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.3s;
            z-index: 300;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: rgba(16, 185, 129, 0.96); }
        .toast.error   { background: rgba(244, 63, 94, 0.96); }
        .toast.info    { background: rgba(30, 41, 59, 0.96); }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.ativo { display: flex; }
        .modal-overlay.center { align-items: center; }
        .modal-overlay.bottom { align-items: flex-end; }

        .modal-sheet {
            background: white;
            border-radius: 28px 28px 0 0;
            padding: 8px 24px 40px;
            width: 100%;
            max-width: 520px;
            animation: slideUpModal 0.3s ease-out;
        }
        .modal-center-box {
            background: white;
            border-radius: 28px;
            padding: 28px 24px;
            width: calc(100% - 48px);
            max-width: 400px;
            animation: zoomIn 0.25s ease-out;
        }
        .modal-handle { width: 40px; height: 4px; background: #e2e8f0; border-radius: 4px; margin: 12px auto 20px; }

        @keyframes slideUpModal { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.93); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .input-edit {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .input-edit:focus { border-color: #6366f1; background: white; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }

        .conta-card {
            background: rgba(255,255,255,0.8);
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.5);
            border-left: 4px solid #6366f1;
            padding: 16px 18px;
            margin-bottom: 12px;
            animation: slideUp 0.3s ease-out both;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 -8px 32px rgba(0,0,0,0.08);
            z-index: 50;
            padding: 8px 0 env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="text-slate-800">

    <div id="loadingBar" class="loading-bar"></div>
    <div id="toastMsg" class="toast info"></div>

    <!-- AUTH OVERLAY -->
    <div id="authOverlay">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black text-slate-800 tracking-tighter">Poppe<span class="text-indigo-600">Fin</span></h1>
                <p class="text-slate-500 text-xs font-semibold mt-1">Módulo de Contas</p>
            </div>
            <div id="authCard" class="glass-card p-8 rounded-[32px]">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-amber-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-university text-amber-500 text-xl"></i>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800">Área Restrita</h2>
                    <p id="authSubtitulo" class="text-slate-400 text-xs mt-1">Confirme sua senha para gerenciar suas contas</p>
                </div>
                <div class="space-y-4">
                    <div id="authUsuarioWrap">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Usuário</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-300"><i class="fas fa-id-badge"></i></span>
                            <input type="text" id="authUsuario"
                                class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-4 pl-12 pr-4 text-slate-700 placeholder-slate-300 outline-none focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all text-sm font-medium"
                                placeholder="INFORME SEU USUÁRIO" oninput="this.value = this.value.toUpperCase()"
                                onkeydown="if(event.key==='Enter') document.getElementById('authSenha').focus()">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Senha</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-300"><i class="fas fa-lock"></i></span>
                            <input type="password" id="authSenha"
                                class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-4 pl-12 pr-4 text-slate-700 placeholder-slate-300 outline-none focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all text-sm"
                                placeholder="••••••••" onkeydown="if(event.key==='Enter') autenticar()">
                        </div>
                    </div>
                    <div id="authErro" class="hidden text-rose-500 text-[11px] font-bold text-center">
                        <i class="fas fa-times-circle mr-1"></i> <span id="authErroMsg">Senha incorreta</span>
                    </div>
                    <button onclick="autenticar()"
                        class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-slate-900 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-unlock-alt text-xs opacity-70"></i> Acessar Contas
                    </button>
                </div>
            </div>
            <div class="mt-6 text-center">
                <button onclick="voltarAuth()" class="text-[10px] uppercase font-black tracking-[0.15em] text-slate-400 hover:text-indigo-600 transition-all flex items-center gap-2 mx-auto">
                    <i class="fas fa-arrow-left text-[9px]"></i> <span id="authVoltarLabel">Voltar ao Login</span>
                </button>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="mainContent" style="display:none;">
        <div class="max-w-3xl mx-auto p-4 md:p-8 space-y-5">

            <!-- Header -->
            <div class="slide-up">
                <div class="flex items-center justify-between mb-1">
                    <div>
                        <button onclick="window.location.href='dashboard.html'"
                            class="text-indigo-500 font-bold text-xs mb-1.5 flex items-center gap-1.5 hover:text-indigo-700 transition-colors active:scale-95">
                            <i class="fas fa-arrow-left text-[10px]"></i> Dashboard
                        </button>
                        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Poppe<span class="text-indigo-600">Fin</span></h1>
                        <p class="text-slate-400 text-xs font-semibold">Minhas Contas</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="trocarApiUrl()" title="Configurar conexão"
                            class="w-10 h-10 bg-white/70 border border-slate-100 rounded-xl flex items-center justify-center shadow-sm active:scale-95">
                            <i class="fas fa-plug text-slate-400 text-sm"></i>
                        </button>
                        <button onclick="carregarDados()"
                            class="w-10 h-10 bg-white/70 border border-slate-100 rounded-xl flex items-center justify-center shadow-sm active:scale-95">
                            <i class="fas fa-sync-alt text-indigo-500 text-sm" id="iconSync"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Busca + Nova Conta -->
            <div class="glass-card p-4 rounded-[24px] flex gap-3">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                    <input type="text" id="campoBusca" oninput="renderizarContas()" placeholder="Buscar por banco, descrição ou titular..."
                        class="w-full bg-white border-none pl-9 pr-3 py-2.5 rounded-xl outline-none shadow-sm text-sm font-medium text-slate-700">
                </div>
                <button onclick="abrirNovaConta()"
                    class="px-4 bg-indigo-600 text-white rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg shadow-indigo-200 active:scale-95">
                    <i class="fas fa-plus"></i> <span class="hidden md:inline">Nova Conta</span>
                </button>
            </div>

            <!-- Contador -->
            <div class="flex items-center justify-between px-1">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wide" id="contadorResultados">— contas</p>
                <p class="text-[11px] font-bold text-slate-800" id="totalPatrimonioLabel"></p>
            </div>

            <!-- Lista -->
            <div id="listaContas" class="space-y-1"></div>

        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <div class="flex items-center justify-around px-2 h-16">
                <button onclick="window.location.href='dashboard.html'" class="flex flex-col items-center gap-1 text-slate-400 flex-1 py-2">
                    <i class="fas fa-chart-pie text-lg"></i>
                    <span class="text-[9px] font-bold uppercase tracking-wide">Dashboard</span>
                </button>
                <button onclick="window.location.href='extrato.html'" class="flex flex-col items-center gap-1 text-slate-400 flex-1 py-2">
                    <i class="fas fa-list-ul text-lg"></i>
                    <span class="text-[9px] font-bold uppercase tracking-wide">Extrato</span>
                </button>
                <button onclick="window.location.href='lancamento.html'" class="flex flex-col items-center gap-1 text-slate-400 flex-1 py-2">
                    <i class="fas fa-plus text-lg"></i>
                    <span class="text-[9px] font-bold uppercase tracking-wide">Novo</span>
                </button>
                <button class="flex flex-col items-center gap-1 text-amber-500 flex-1 py-2">
                    <i class="fas fa-university text-lg"></i>
                    <span class="text-[9px] font-bold uppercase tracking-wide">Contas</span>
                </button>
                <button onclick="window.location.href='gerenciamento.html'" class="flex flex-col items-center gap-1 text-slate-400 flex-1 py-2">
                    <i class="fas fa-sliders-h text-lg"></i>
                    <span class="text-[9px] font-bold uppercase tracking-wide">Gerenciar</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- MODAL CRIAR/EDITAR CONTA -->
    <div id="modalConta" class="modal-overlay bottom">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2" id="modalContaTitulo">
                    <i class="fas fa-university text-amber-500"></i> Nova Conta
                </h3>
                <button onclick="fecharModal('modalConta')" class="w-8 h-8 flex items-center justify-center rounded-xl bg-slate-100 text-slate-400 active:scale-95">

            </div>
            <div class="space-y-4">

                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Banco</label>
                    <input type="text" id="contaBanco" class="input-edit" placeholder="Ex: Nubank, Itaú, XP...">

                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Descrição</label>

                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="fecharModal('modalConta')" class="flex-1 py-3.5 font-bold text-slate-500 bg-slate-100 rounded-xl active:scale-95 transition-all">Cancelar</button>
                    <button onclick="salvarConta()" id="btnSalvarConta"
                        class="flex-1 py-3.5 font-bold bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-200 active:scale-95 transition-all flex items-center justify-center gap-2">

    <!-- MODAL EXCLUSÃO -->
    <div id="modalExcluirConta" class="modal-overlay center">
        <div class="modal-center-box">
            <div class="text-center">
                <div class="w-14 h-14 bg-rose-50 rounded-full flex items-center justify-center mx-auto mb-4">

                </div>

                <p class="text-slate-500 text-sm mb-1">Contas com movimentações vinculadas não podem ser excluídas.</p>
                <p id="excluirContaInfo" class="text-xs font-bold text-slate-400 mb-6"></p>
                <div class="flex gap-3">
                    <button onclick="fecharModal('modalExcluirConta')" class="flex-1 py-3.5 font-bold text-slate-500 bg-slate-100 rounded-xl active:scale-95">Cancelar</button>
                    <button onclick="confirmarExclusaoConta()" id="btnConfirmarExcluirConta"
                        class="flex-1 py-3.5 font-bold bg-rose-500 text-white rounded-xl active:scale-95">
                        <i class="fas fa-trash text-sm"></i> Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONEXÃO COM A API (Google Apps Script)
        // ============================================================
        // URL padrão do Web App do Apps Script — já embutida no código, então
        // nenhum dispositivo novo precisa colar a URL manualmente. Se um dia você
        // reimplantar o Apps Script e a URL mudar, use o botão de configuração
        // (ícone da tomada) para trocar; a nova URL fica salva só naquele navegador.
        const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwaIsf1cABPNnlYHZRwzf2oAItMbyKk33Uz_JPj9fysQHVF9dBaCRqnJvCsjOA8_crG_g/exec';
        function getApiUrl() {
            let u = localStorage.getItem('poppefinApiUrl');
            if (!u) {
                u = DEFAULT_API_URL;
                localStorage.setItem('poppefinApiUrl', u);
            }
            return u || '';
        }
        function trocarApiUrl() {
            const atual = localStorage.getItem('poppefinApiUrl') || '';
            const nova = prompt('URL do Apps Script:', atual);
            if (nova && nova.trim()) { localStorage.setItem('poppefinApiUrl', nova.trim()); location.reload(); }
        }
        const SCRIPT_URL = getApiUrl();
        console.log('[PoppeFin] SCRIPT_URL em uso:', SCRIPT_URL);

        async function apiGet(action) {
            let res;
            try {
                res = await fetch(`${SCRIPT_URL}?action=${action}&t=${Date.now()}`);
            } catch (err) {
                throw new Error('Falha de rede/CORS ao contatar a API. Confira a URL configurada (ícone da tomada).');
            }
            const text = await res.text();
            let json;
            try {
                json = JSON.parse(text);
            } catch (err) {
                console.error('[PoppeFin] Resposta não-JSON recebida:', text.slice(0, 500));
                if (/accounts\.google\.com|ServiceLogin|Sign in/i.test(text)) {
                    throw new Error('O Apps Script pediu login do Google. Reimplante com acesso "Qualquer pessoa" (não "Qualquer pessoa com Google").');
                }
                throw new Error('A API não retornou JSON válido. Confira se a URL termina em /exec e se foi implantada como App da Web.');
            }
            if (!json.success) throw new Error(json.message || 'Erro ao buscar dados');
            return json;
        }
        async function apiPost(action, data) {
            let res;
            try {
                res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, data })
                });
            } catch (err) {
                throw new Error('Falha de rede/CORS ao contatar a API. Confira a URL configurada (ícone da tomada).');
            }
            const text = await res.text();
            let json;
            try {
                json = JSON.parse(text);
            } catch (err) {
                console.error('[PoppeFin] Resposta não-JSON recebida:', text.slice(0, 500));
                if (/accounts\.google\.com|ServiceLogin|Sign in/i.test(text)) {
                    throw new Error('O Apps Script pediu login do Google. Reimplante com acesso "Qualquer pessoa" (não "Qualquer pessoa com Google").');
                }
                throw new Error('A API não retornou JSON válido ao salvar. Confira a implantação do Apps Script.');
            }
            if (!json.success) throw new Error(json.message || 'Erro ao salvar dados');
            return json;
        }

        const USUARIOS = { "MACIEL": "37541680", "DEBORA": "barbara123" };

        // ============================================================
        // SESSÃO — compartilhada com o gerenciamento (10 min inatividade)
        // ============================================================
        const TIMEOUT_MS = 10 * 60 * 1000;
        let sessionTimer;
        function iniciarSessao() {
            clearTimeout(sessionTimer);
            sessionStorage.setItem('gerencSession', Date.now().toString());
            sessionTimer = setTimeout(() => {
                sessionStorage.removeItem('gerencSession');
                sessionStorage.removeItem('gerencAuth');
                window.location.href = 'dashboard.html';
            }, TIMEOUT_MS);
        }
        ['touchstart', 'click', 'keydown', 'scroll'].forEach(ev => {
            document.addEventListener(ev, () => {
                if (sessionStorage.getItem('gerencAuth') === '1') iniciarSessao();
            }, { passive: true });
        });

        // ============================================================
        // AUTENTICAÇÃO — reaproveita a sessão do módulo de Gerenciamento
        // ============================================================
        function setupAuth() {
            const dashUser = sessionStorage.getItem('dashUser') || '';
            if (dashUser) {
                document.getElementById('authUsuarioWrap').style.display = 'none';
                document.getElementById('authSubtitulo').textContent = 'Confirme sua senha para continuar';
                document.getElementById('authVoltarLabel').textContent = 'Voltar ao Dashboard';
            } else {
                document.getElementById('authUsuarioWrap').style.display = 'block';
                document.getElementById('authSubtitulo').textContent = 'Informe usuário e senha para acessar';
                document.getElementById('authVoltarLabel').textContent = 'Voltar ao Login';
            }
        }
        function voltarAuth() {
            const dashUser = sessionStorage.getItem('dashUser') || '';
            window.location.href = dashUser ? 'dashboard.html' : 'index.html';
        }
        function autenticar() {
            const pass = document.getElementById('authSenha').value;
            const erro = document.getElementById('authErro');
            const erroMsg = document.getElementById('authErroMsg');
            const card = document.getElementById('authCard');
            const dashUser = sessionStorage.getItem('dashUser') || '';
            let senhaOk = false, usuarioFinal = dashUser;

            if (dashUser) {
                if (USUARIOS[dashUser]) { senhaOk = USUARIOS[dashUser] === pass; erroMsg.textContent = 'Senha incorreta'; }
            } else {
                const inputUser = document.getElementById('authUsuario').value.trim().toUpperCase();
                if (!inputUser) { erroMsg.textContent = 'Informe o usuário'; erro.classList.remove('hidden'); return; }
                if (!USUARIOS[inputUser]) {
                    erroMsg.textContent = 'Usuário não encontrado'; erro.classList.remove('hidden');
                    card.style.animation = 'shake 0.4s ease-in-out'; setTimeout(() => card.style.animation = '', 400);
                    return;
                }
                senhaOk = USUARIOS[inputUser] === pass; usuarioFinal = inputUser; erroMsg.textContent = 'Usuário ou senha incorretos';
            }

            if (senhaOk) {
                erro.classList.add('hidden');
                sessionStorage.setItem('gerencAuth', '1');
                if (!dashUser && usuarioFinal) sessionStorage.setItem('dashUser', usuarioFinal);
                document.getElementById('authOverlay').style.opacity = '0';
                document.getElementById('authOverlay').style.transition = 'opacity 0.4s';
                setTimeout(() => {
                    document.getElementById('authOverlay').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                }, 400);
                iniciarSessao();
                carregarDados();
            } else {
                erro.classList.remove('hidden');
                card.style.animation = 'shake 0.4s ease-in-out';
                setTimeout(() => card.style.animation = '', 400);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupAuth();
            const gerencAuth = sessionStorage.getItem('gerencAuth');
            const gerencTs = parseInt(sessionStorage.getItem('gerencSession') || '0');
            const elapsed = Date.now() - gerencTs;
            if (gerencAuth === '1' && elapsed < TIMEOUT_MS) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                iniciarSessao();
                carregarDados();
            }
        });

        // ============================================================
        // DADOS
        // ============================================================
                // Normaliza o campo "tipo" vindo da planilha — lida com dados antigos
        // gravados como "Entrada"/"Saída" (só a 1ª maiúscula) em vez do formato
        // ENTRADA/SAÍDA/TRANSFERÊNCIA que o backend novo grava.
        function normalizarTipoApi(raw) {
            const t = (raw || '').toString().trim().toUpperCase();
            if (t === 'ENTRADA') return 'ENTRADA';
            if (t === 'SAÍDA' || t === 'SAIDA') return 'SAÍDA';
            if (t.indexOf('TRANSFER') === 0) return 'TRANSFERÊNCIA';
            return 'SAÍDA';
        }
        let contas = [];
        let movimentacoes = [];
        let idParaExcluir = null;

        function fmt(v) { return (parseFloat(v) || 0).toLocaleString('pt-br', { style: 'currency', currency: 'BRL' }); }

        function setLoading(v) { document.getElementById('loadingBar').classList.toggle('ativo', v); }

        function mostrarToast(msg, tipo = 'info', icon = 'fa-info-circle') {
            const t = document.getElementById('toastMsg');
            t.className = `toast ${tipo} show`;
            t.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
            setTimeout(() => t.classList.remove('show'), 2800);
        }

        async function carregarDados() {
            setLoading(true);
            const icon = document.getElementById('iconSync');
            icon?.classList.add('animate-spin');
            try {
                const resultado = await apiGet('getAll');
                contas = resultado.contas || [];
                movimentacoes = resultado.movimentacoes || [];
                renderizarContas();
            } catch (e) {
                mostrarToast(e.message || 'Erro ao carregar contas', 'error', 'fa-times-circle');
            } finally {
                setLoading(false);
                icon?.classList.remove('animate-spin');
            }
        }

        function saldoDaConta(id) {
            let saldo = 0;
            movimentacoes.forEach(m => {
                const valor = parseFloat(m.valor) || 0;
                const rend = parseFloat(m.valorRendimento) || 0;
                if (String(m.idConta) === String(id)) {
                    saldo += (normalizarTipoApi(m.tipo) === 'ENTRADA' ? valor : -valor) + rend;
                }
                if (normalizarTipoApi(m.tipo) === 'TRANSFERÊNCIA' && String(m.idContaDestino) === String(id)) {
                    saldo += valor;
                }
            });
            return saldo;
        }

        function qtdMovimentacoes(id) {
            return movimentacoes.filter(m => String(m.idConta) === String(id) || String(m.idContaDestino) === String(id)).length;
        }

        function renderizarContas() {
            const busca = (document.getElementById('campoBusca').value || '').toLowerCase();
            const lista = contas.filter(c =>
                !busca ||
                (c.banco || '').toLowerCase().includes(busca) ||
                (c.descricao || '').toLowerCase().includes(busca) ||
                (c.titular || '').toLowerCase().includes(busca)
            );

            document.getElementById('contadorResultados').textContent = `${lista.length} conta${lista.length !== 1 ? 's' : ''}`;
            const totalGeral = contas.reduce((acc, c) => acc + saldoDaConta(c.id), 0);
            document.getElementById('totalPatrimonioLabel').textContent = `Patrimônio: ${fmt(totalGeral)}`;

            const container = document.getElementById('listaContas');
            if (lista.length === 0) {
                container.innerHTML = `
                <div class="text-center py-16 text-slate-400">
                    <i class="fas fa-university text-4xl mb-4 opacity-40"></i>
                    <p class="font-bold">${contas.length === 0 ? 'Nenhuma conta cadastrada ainda' : 'Nenhuma conta encontrada'}</p>
                    ${contas.length === 0 ? '<p class="text-xs mt-1">Toque em "Nova Conta" para começar</p>' : ''}
                </div>`;
                return;
            }

            container.innerHTML = lista.map((c, i) => {
                const saldo = saldoDaConta(c.id);
                const qtd = qtdMovimentacoes(c.id);
                return `
                <div class="conta-card" style="animation-delay:${Math.min(i * 0.04, 0.4)}s">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-university text-indigo-500 text-sm"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="font-bold text-slate-800 text-sm truncate">${c.banco || '—'} <span class="font-normal text-slate-400">| ${c.descricao || ''}</span></p>
                                <p class="text-[10px] text-slate-400 font-semibold truncate"><i class="fas fa-user text-[9px] mr-1"></i>${c.titular || '—'}</p>
                                <div class="flex items-center gap-2 mt-1 flex-wrap">
                                    <span class="text-[9px] bg-slate-100 text-slate-400 font-bold px-1.5 py-0.5 rounded-md">#${c.id}</span>
                                    <span class="text-[9px] text-slate-400">${qtd} movimentaç${qtd !== 1 ? 'ões' : 'ão'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="font-black text-sm ${saldo >= 0 ? 'text-slate-800' : 'text-rose-600'}">${fmt(saldo)}</p>
                            <div class="flex gap-1.5 mt-2 justify-end">
                                <button onclick="abrirEditarConta('${c.id}')" class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center active:scale-95">
                                    <i class="fas fa-edit text-[11px]"></i>
                                </button>
                                <button onclick="abrirExclusaoConta('${c.id}')" class="w-8 h-8 rounded-lg bg-rose-50 text-rose-500 flex items-center justify-center active:scale-95">
                                    <i class="fas fa-trash text-[11px]"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // ============================================================
        // CRIAR / EDITAR
        // ============================================================
        function abrirModal(id) { document.getElementById(id).classList.add('ativo'); }
        function fecharModal(id) { document.getElementById(id).classList.remove('ativo'); }

        function abrirNovaConta() {
            document.getElementById('contaId').value = '';
            document.getElementById('contaBanco').value = '';
            document.getElementById('contaDescricao').value = '';
            document.getElementById('contaTitular').value = '';
            document.getElementById('modalContaTitulo').innerHTML = '<i class="fas fa-university text-amber-500"></i> Nova Conta';
            abrirModal('modalConta');
        }

        function abrirEditarConta(id) {
            const c = contas.find(x => String(x.id) === String(id));
            if (!c) return;
            document.getElementById('contaId').value = c.id;
            document.getElementById('contaBanco').value = c.banco || '';
            document.getElementById('contaDescricao').value = c.descricao || '';
            document.getElementById('contaTitular').value = c.titular || '';
            document.getElementById('modalContaTitulo').innerHTML = '<i class="fas fa-edit text-indigo-500"></i> Editar Conta';
            abrirModal('modalConta');
        }

        async function salvarConta() {
            const id = document.getElementById('contaId').value;
            const banco = document.getElementById('contaBanco').value.trim();
            const descricao = document.getElementById('contaDescricao').value.trim();
            const titular = document.getElementById('contaTitular').value.trim();

            if (!banco || !descricao || !titular) {
                mostrarToast('Preencha banco, descrição e titular.', 'error', 'fa-times-circle');
                return;
            }

            const btn = document.getElementById('btnSalvarConta');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            setLoading(true);

            try {
                if (id) {
                    await apiPost('updateAccount', { id, banco, descricao, titular });
                    mostrarToast('✅ Conta atualizada com sucesso!', 'success', 'fa-check-circle');
                } else {
                    await apiPost('createAccount', { banco, descricao, titular });
                    mostrarToast('✅ Conta cadastrada com sucesso!', 'success', 'fa-check-circle');
                }
                fecharModal('modalConta');
                await carregarDados();
            } catch (e) {
                mostrarToast(e.message || 'Erro ao salvar conta', 'error', 'fa-times-circle');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save text-xs opacity-70"></i> Salvar';
                setLoading(false);
            }
        }

        // ============================================================
        // EXCLUSÃO
        // ============================================================
        function abrirExclusaoConta(id) {
            const c = contas.find(x => String(x.id) === String(id));
            if (!c) return;
            idParaExcluir = id;
            const qtd = qtdMovimentacoes(id);
            document.getElementById('excluirContaInfo').textContent =
                `${c.banco} · ${c.descricao} · ${c.titular}` + (qtd > 0 ? ` — possui ${qtd} movimentação${qtd !== 1 ? 'ões' : ''}` : '');
            abrirModal('modalExcluirConta');
        }

        async function confirmarExclusaoConta() {
            if (!idParaExcluir) return;
            const btn = document.getElementById('btnConfirmarExcluirConta');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            setLoading(true);
            try {
                const resultado = await apiPost('deleteAccount', { id: idParaExcluir });
                if (resultado.success === false) {
                    mostrarToast(resultado.message || 'Não foi possível excluir', 'error', 'fa-times-circle');
                } else {
                    mostrarToast('🗑️ Conta excluída com sucesso!', 'success', 'fa-check-circle');
                    fecharModal('modalExcluirConta');
                    await carregarDados();
                }
            } catch (e) {
                mostrarToast(e.message || 'Esta conta possui movimentações e não pode ser excluída.', 'error', 'fa-times-circle');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-trash text-sm"></i> Excluir';
                setLoading(false);
                idParaExcluir = null;
            }
        }

        ['modalConta', 'modalExcluirConta'].forEach(id => {
            document.getElementById(id).addEventListener('click', function (e) {
                if (e.target === this) fecharModal(id);
            });
        });
    </script>
</body>
</html>
